name: Deploy presentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - koica-oos-ai-data-training.html
      - .github/workflows/deploy-pages.yml
      - scripts/build-public-pages.mjs
      - scripts/export-presentation-pdf.cjs
      - assets/video/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public presentation
        run: |
          mkdir -p _site
          node scripts/build-public-pages.mjs koica-oos-ai-data-training.html _site/index.html
          mkdir -p _site/assets/video
          cp assets/video/*-demo.mp4 assets/video/*-poster.jpg _site/assets/video/
          touch _site/.nojekyll

      - name: Install Chromium PDF renderer
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Export presentation PDF
        run: node scripts/export-presentation-pdf.cjs _site/index.html _site/koica-oos-ai-data-training.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
